# Atualizações automáticas de dependências (Dependabot).
# Documentação: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # Dependências npm (package.json e package-lock.json na raiz)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"

  # Imagens base do Dockerfile (node:24-alpine)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  # Actions usadas em .github/workflows/ci.yml (actions/checkout, actions/setup-node)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
